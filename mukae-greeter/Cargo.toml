[package]
name = "mukae-greeter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mukae (迎え) — the greeter binary. The pleme-io login face, as something a display manager can exec."

# The binary is `mukae`, not `mukae-greeter`: it is what appears in a greetd
# command line and in an operator's muscle memory, and the crate name only
# exists to keep the workspace unambiguous.
[[bin]]
name = "mukae"
path = "src/main.rs"

[dependencies]
mukae-face = { path = "../mukae-face", version = "0.1.0" }
mukae-spec = { path = "../mukae-spec", version = "0.1.0" }
mukae = { path = "../mukae", version = "0.1.0" }
kanshou = "0.1"
egaku-term = "0.3"
egaku = "0.1"

# ★ The PAM half is linux-only BY TARGET, not by feature. mukae-host links
# libpam and is `cfg(target_os = "linux")`; making this a feature would let a
# darwin build select it and fail at link time with a message about `-lpam`
# rather than about the platform. The face stays buildable everywhere, which
# is what makes it testable on the machine this is usually written from.
[target.'cfg(target_os = "linux")'.dependencies]
mukae-host = { path = "../mukae-host", version = "0.1.0" }
mukae-greetd = { path = "../mukae-greetd", version = "0.1.0" }

[lints.clippy]
pedantic = "warn"
