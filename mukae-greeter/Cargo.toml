[package]
name = "mukae-greeter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mukae (迎え) — the greeter binary. The pleme-io login face, as something a display manager can exec."

# The binary is `mukae`, not `mukae-greeter`: it is what appears in a greetd
# command line and in an operator's muscle memory, and the crate name only
# exists to keep the workspace unambiguous.
[[bin]]
name = "mukae"
path = "src/main.rs"

[dependencies]
mukae-face = { path = "../mukae-face", version = "0.1.0" }
mukae-spec = { path = "../mukae-spec", version = "0.1.0" }
mukae = { path = "../mukae", version = "0.1.0" }
kanshou = "0.1"
# ── MCP face (see src/mcp.rs) — read-only observation of the login flow.
#
# ★ OPTIONAL, AND OFF BY DEFAULT. Not timidity — a measured build failure.
# rmcp uses `env!("CARGO_CRATE_NAME")`, which crate2nix does not set, so it
# fails under THIS workspace's builder with:
#
#   error: environment variable `CARGO_CRATE_NAME` not defined at compile time
#
# That cascaded rmcp -> mukae-greeter -> greetd.toml -> system-path ->
# nixos-system-plo and took plo's LOGIN SCREEN out of the build, leaving the
# node gitops-DEGRADED for 47 reconcile cycles (2026-08-28).
#
# mado carries the same rmcp 0.15 and builds fine, because it is built by
# `substrate.rust.tool`; this workspace uses
# `rust-library-workspace-flake.nix`, which does not set the variable. So the
# defect is a builder gap, and the durable fix belongs in substrate.
#
# ★ WHY A FEATURE AND NOT A REVERT. Pinning the consumer back was tried and
# is NOT durable: the next routine `nix flake update` anywhere in the fleet
# re-bumps mukae and re-breaks plo, which is exactly what happened. A default
# that cannot build is a fleet-wide hazard no consumer can defend against.
# Gating it here makes the default build safe for every consumer while the
# code stays present and buildable with `--features mcp`.
#
# ── ★ BOTH BLOCKERS ARE NOW CLOSED (2026-09-02) ──────────────────────────
# 1. The BUILDER half: substrate 63acf13 shares its CARGO_CRATE_NAME fixups
#    between library.nix and library-workspace.nix
#    (lib/build/rust/crate-env-fixups.nix), so rmcp compiles under the builder
#    this workspace uses. Verified by forcing the feature on.
# 2. The OTHER half was NOT a crate2nix defect, and an earlier revision of this
#    note said it was. It was a plain cfg bug in this crate: `run_under_mukaed`
#    was gated on the feature alone while its dependencies live in a
#    `[target.'cfg(target_os = "linux")'.dependencies]` table. The control
#    settles the mechanism — plain `cargo check -p mukae-greeter` outside nix
#    failed identically, and `--no-default-features` succeeded. Fixed in
#    mukae 21e41ba.
#
# Measured after both: `cargo check -p mukae-greeter --features mcp` exit 0 and
# `nix build .#mukae-greeter` green on aarch64-darwin.
#
# The feature is STILL off by default here, deliberately. Turning it on changes
# plo's login binary, and the sequencing that makes that safe is: the NIX repo's
# substrate pin must already carry 63acf13 (it does — flake.lock, via
# c81ab4bb), because plo builds mukae with `inputs.substrate.follows`. Flip it
# as a deliberate step with that checked, not as a side effect.
#
rmcp = { version = "0.15", features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt", "io-util", "macros", "sync", "time"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

egaku-term = "0.3"
egaku = "0.1"

# ★ The PAM half is linux-only BY TARGET, not by feature. mukae-host links
# libpam and is `cfg(target_os = "linux")`; making this a feature would let a
# darwin build select it and fail at link time with a message about `-lpam`
# rather than about the platform. The face stays buildable everywhere, which
# is what makes it testable on the machine this is usually written from.
[target.'cfg(target_os = "linux")'.dependencies]
mukae-greetd = { path = "../mukae-greetd", version = "0.1.0" }
# ★ OPTIONAL, AND OFF BY DEFAULT — this is the only thing in the binary that
# would link a `.so`. See the `pam` feature below.
mukae-host = { path = "../mukae-host", version = "0.1.0", optional = true }
# The daemon transport. Optional for the same reason mukae-host is: a face
# built for greetd should not carry the seat crate, and vice versa.
mukae-seat = { path = "../mukae-seat", version = "0.1.0", optional = true }

[features]
# The MCP sidecar. OFF by default — see the dependency block above.
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
# ★ DEFAULT IS EMPTY, SO THE SHIPPED BINARY LINKS NO libpam.
#
# `--greetd` — the mode that actually seats a person — speaks a socket and
# needs no C library at all. `--authenticate` drives libpam directly, which is
# the GUEST path: libpam is a C library with an ABI, not a wire, so the
# naturalize waiver does not cover it. Defaulting it off means the binary a
# machine boots carries libc and nothing else.
#
# MODULARIZE, DON'T DELETE: the PAM path keeps working, keeps its tests, and
# keeps being buildable with `--features pam`. It is configured off, not
# removed — reviving it is a flag, not a rewrite.
# ★ `mukaed` IS in the default set, and the comment on it below explains
# why. It was NOT, for as long as mukaed has existed, while that comment
# claimed it was -- see the note there. Adding it costs no C library:
# mukae-seat is Rust over libc syscalls, so the "binary a machine boots
# carries libc and nothing else" property below is unchanged.
default = ["mukaed", "mcp"]
pam = ["dep:mukae-host"]
# Run as mukaed's face.
#
# ── ★ THIS COMMENT WAS TRUE OF THE INTENT AND FALSE OF THE CODE ──────────
# It said "ON by default" while `default = []` sat six lines above, and the
# two disagreed for as long as mukaed existed. What that bought, measured on
# plo 2026-08-28: the shipped greeter contained no daemon mode at all -- zero
# occurrences of MUKAE_SOCK_FD in the binary -- so mukaed spawned it, passed
# it a socket on fd 3, and it drew a standalone face that spoke to nobody.
# Every process was alive and the screen stayed black.
#
# The lesson is not "keep comments in sync". It is that a comment asserting
# a fact about the code NEXT TO IT is the one place a reader will never
# think to check, so it must be the thing you check first.
#
# ON by default is deliberate: mukaed IS the intended
# transport now, and a greeter that cannot speak to it has to be asked for.
mukaed = ["dep:mukae-seat"]

[lints.clippy]
pedantic = "warn"
