[package]
name = "mukae-greetd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mukae (迎え) — the greetd transport. The same conversation the PAM backend produces, spoken over greetd's socket instead."

[dependencies]
mukae-spec = { path = "../mukae-spec", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
pedantic = "warn"
