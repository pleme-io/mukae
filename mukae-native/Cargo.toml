[package]
name = "mukae-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mukae (迎え) — credential verification in pure Rust. No libpam, no .so, no C ABI: the shadow file read and the hash checked here."

[dependencies]
mukae-spec = { path = "../mukae-spec", version = "0.1.0" }
# The two hash schemes a NixOS shadow file actually contains. Both pure Rust,
# both RustCrypto: yescrypt is NixOS's default and sha512crypt is what older
# entries carry.
# `password-hash` gives the crypt-string (MCF) layer — `$y$params$salt$hash`
# parsed and verified by RustCrypto rather than by hand. Hand-rolling that
# encoding is where a hash verifier goes wrong in the direction that ACCEPTS.
yescrypt = { version = "0.1", features = ["password-hash"] }
# Everything a shadow file can hold that is not yescrypt: $6$ sha512crypt,
# $5$ sha256crypt, $1$ md5crypt, bcrypt, and the historical forms. Dispatches
# on the prefix itself, so this crate does not re-derive that table.
pwhash = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

# ── ★ D-Bus, and ONLY on Linux ────────────────────────────────────────────
# logind is the one thing here we speak to rather than replace, and its
# transport is a wire. zbus is pure Rust — it implements the D-Bus protocol
# itself rather than binding libdbus, so this adds no .so, which is the whole
# point of the crate it lives in.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
zvariant = "5"

[lints.clippy]
pedantic = "warn"
